[workspace]
resolver = "2"
# The SQLite extension builds separately: see its Cargo.toml.
exclude = ["crates/ivmlite-sqlite"]
members = ["crates/ivmlite-bench", "crates/ivmlite-core", "crates/ivmlite-sql", "crates/ivmlite-test", "crates/ivmlite-workload"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/SFARL/ivmlite"

[workspace.dependencies]
ivmlite-core = { path = "crates/ivmlite-core" }
ivmlite-sql = { path = "crates/ivmlite-sql" }
rusqlite = { version = "0.40", features = ["bundled"] }
rand = "0.10"
